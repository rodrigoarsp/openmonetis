name: openmonetis

# Produção em servidor próprio atrás de um Cloudflare Tunnel.
# O HTTPS e o DNS ficam na Cloudflare; o app só expõe HTTP na porta APP_PORT.
# O banco é um PostgreSQL no próprio compose (volume persistente, sem porta
# publicada). POSTGRES_USER/PASSWORD/DB vêm do .env.production.
#
# Uso:
#   cp .env.production.example .env.production   # e preencher os valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# No túnel, aponte o hostname para http://<IP-do-servidor>:APP_PORT.

services:
  db:
    image: postgres:17-alpine
    container_name: openmonetis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmonetis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-openmonetis_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmonetis} -d ${POSTGRES_DB:-openmonetis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmonetis:local
    container_name: openmonetis_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3210}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmonetis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openmonetis_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
